name: IMDb Nightly Automation Suite

on:
  schedule:
    - cron: '30 18 * * *'  # runs 12:00 AM IST (6:30 PM UTC) every night
  push:
    branches: [ main ]      # also runs on every push
  workflow_dispatch:         # allows manual trigger from GitHub UI

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: playwright install chromium

      - name: Run Tests
        env:
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
        run: |
          pytest tests/ -v -s -n 3\
          --html=report.html \
          --self-contained-html

      - name: Upload HTML Report
        uses: actions/upload-artifact@v4
        if: always()   # upload report even if tests fail
        with:
          name: IMDb-Test-Report
          path: report.html
